# ============================================================
# Production profile — active when SPRING_PROFILES_ACTIVE=prod
# All secrets come from Railway environment variables.
# ============================================================

# ========================
# Connection pool (lean for Railway Hobby)
# ========================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ========================
# Redis — Railway provides a single REDIS_URL (redis://:pass@host:port).
# Using the URL property overrides the individual host/port/password bindings
# in application.properties, which avoids failures when Railway sets REDIS_PORT
# to an empty string instead of a number.
# ========================
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=false

# ========================
# Actuator — expose only health for Railway health checks
# ========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.port=8080
