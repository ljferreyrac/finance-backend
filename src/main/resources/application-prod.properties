# ============================================================
# Production profile — active when SPRING_PROFILES_ACTIVE=prod
# All secrets come from Railway environment variables.
# ============================================================

# ========================
# Connection pool (lean for Railway Hobby)
# ========================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ========================
# Redis — Railway instances require TLS
# ========================
spring.data.redis.ssl.enabled=true

# ========================
# Actuator — expose only health for Railway health checks
# ========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.server.port=8080
