# ========================
# Application
# ========================
spring.application.name=finanzas-ia-backend
server.port=8080

# ========================
# Database (PostgreSQL)
# ========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finanzasiadb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ========================
# Redis (refresh token store — key/value only, no Redis repositories)
# ========================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false
spring.data.redis.repositories.enabled=false

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET:change-this-to-a-256-bit-secret-in-production-env}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ========================
# Error handling (never expose internals)
# ========================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ========================
# Actuator (health only, no sensitive endpoints)
# ========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ========================
# Gemini AI (voice extraction)
# ========================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
